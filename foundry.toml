[profile.default]
out = "foundry-out"
auto_detect_solc = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "none"
gas_limit = "3000000000"
fs_permissions = [
    { access = "read", path = "foundry-out/" },
    { access = "read", path = "deepstate-out/" }
]

# Builds the real DeepState engine artifact used by differential/fuzz tests.
[profile.deepstate_artifact]
out = "deepstate-out"
via_ir = true
optimizer = true
optimizer_runs = 200

# Mirrors the relevant v4-hooks-public aggregator-hooks compiler profile.
[profile.aggregator_hooks]
via_ir = false
optimizer_runs = 200

[fuzz]
runs = 256
